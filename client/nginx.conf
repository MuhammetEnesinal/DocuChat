server {
    listen 80;
    server_name _;

    # Upload limiti: backend 50 MB kabul ediyor + multipart payı
    client_max_body_size 60m;

    # API istekleri → api container'ı. SSE (chat stream) için buffering KAPALI olmalı,
    # yoksa nginx cevabı biriktirir ve token akışı ölür.
    location /api/ {
        proxy_pass http://api:5025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Belge görselleri/önizlemeleri → api'nin static dosya servisi
    location /uploads/ {
        proxy_pass http://api:5025;
        proxy_set_header Host $host;
    }

    # SPA: bilinmeyen her yol index.html'e düşer (React Router)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
