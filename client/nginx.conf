# WebSocket upgrade eşlemesi (SignalR için). Upgrade header'ı varsa "upgrade", yoksa "close".
# Bu dosya /etc/nginx/conf.d/default.conf olarak http{} içine include edildiğinden map burada geçerli.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Upload limiti: backend 50 MB kabul ediyor + multipart payı
    client_max_body_size 60m;

    # API istekleri → api container'ı. SSE (chat stream) için buffering KAPALI olmalı,
    # yoksa nginx cevabı biriktirir ve token akışı ölür.
    location /api/ {
        proxy_pass http://api:5025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SignalR realtime hub → api container. WebSocket UPGRADE ŞART: yoksa /hubs/.../negotiate
    # SPA'nın index.html'ine düşer ve realtime hiç bağlanmaz. Kalıcı soket için buffering kapalı
    # + uzun read/send timeout. access_token query string'i nginx varsayılan olarak iletir.
    location /hubs/ {
        proxy_pass http://api:5025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Belge görselleri/önizlemeleri → api'nin static dosya servisi
    location /uploads/ {
        proxy_pass http://api:5025;
        proxy_set_header Host $host;
    }

    # Hash'li asset dosyaları (Vite içerik-hash'li ad verir: Chat-a1b2c3.js). İçerik değişince ad
    # da değişir → bayat kalması İMKANSIZ → sonsuza dek cache'lenebilir (immutable). Böylece tekrar
    # ziyaretlerde JS/CSS yeniden indirilmez.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA giriş noktası: bilinmeyen her yol index.html'e düşer (React Router). index.html ASLA uzun
    # cache'lenMEMELİ: aksi halde deploy sonrası tarayıcı, eski chunk adlarına işaret eden bayat
    # index.html'i sunar ve kullanıcı ESKİ kodu çalıştırır (silme/başka davranışlar eski görünür).
    # no-cache = tarayıcı her seferinde sunucuyla doğrular (ETag ile değişmediyse 304, ucuz).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
