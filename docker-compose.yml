# DocuChat — tüm sistem tek komutla: docker compose up -d --build
# Sırlar kökteki .env dosyasından okunur (bkz. .env.example).
#
# Host portları lokal geliştirme servisleriyle ÇAKIŞMAZ:
#   web   → http://localhost:8080   (uygulamanın adresi)
#   api   → http://localhost:5026   (Swagger/direkt erişim; içerde 5025)
#   db    → localhost:5434          (lokal Postgres 5432'ye dokunmaz; 5433 başka bir projede dolu)
#   ollama/reranker → dışarı açılmaz (yalnız container ağı)

services:
  db:
    restart: unless-stopped
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: DocuChatDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host portu yalnız dışarıdan hata ayıklama içindir; api container'ı db'ye iç ağdan
      # (db:5432) bağlanır. 5433 bu makinede başka bir projeye ait olduğu için 5434 kullanılır.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DocuChatDB"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    restart: unless-stopped
    image: ollama/ollama
    # serve başlar, bge-m3 çekilir (varsa anında geçer), sonra serve'e bağlı kalınır
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 4; ollama pull bge-m3; wait"]
    volumes:
      - ollama:/root/.ollama

  reranker:
    restart: unless-stopped
    build: ./rerank-service
    volumes:
      - hfcache:/models

  # MinIO — S3-uyumlu object storage (belge + görsel deposu). api içeriden minio:9000 (S3 API)
  # kullanır. 9001 = yönetim konsolu, yalnız localhost'a açılır. Kök kullanıcı = S3 access/secret.
  minio:
    restart: unless-stopped
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"

  api:
    restart: unless-stopped
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      reranker:
        condition: service_started
      minio:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:5025
      ConnectionStrings__Default: Host=db;Port=5432;Database=DocuChatDB;Username=postgres;Password=${POSTGRES_PASSWORD}
      Embedding__BaseUrl: http://ollama:11434
      Reranker__BaseUrl: http://reranker:8085
      LibreOffice__Path: soffice
      # Dosya depolama → MinIO (S3). Bucket startup'ta otomatik oluşturulur (S3BucketInitializer).
      Storage__S3__ServiceUrl: http://minio:9000
      Storage__S3__AccessKey: ${MINIO_ACCESS_KEY}
      Storage__S3__SecretKey: ${MINIO_SECRET_KEY}
      Storage__S3__Bucket: docuchat
      Storage__S3__ForcePathStyle: "true"
      AllowedOrigins__0: http://localhost:8080
      Jwt__Secret: ${JWT_SECRET}
      Llm__ApiKey: ${MISTRAL_API_KEY}
      LlmHelper__ApiKey: ${MISTRAL_HELPER_API_KEY}
      Mistral__ApiKey: ${MISTRAL_API_KEY}
      Caption__ApiKey: ${MISTRAL_API_KEY}
      Email__Password: ${EMAIL_PASSWORD}
    ports:
      # SADECE localhost'a bağlı. Gerçek trafik web (nginx) üzerinden gelir; bu port yalnız
      # geliştirme/hata ayıklama içindir. Dışarı açık bırakılırsa: API, X-Forwarded-For'a güvenen
      # ForwardedHeaders ile çalıştığı ve Docker ağ aralığı güvenilir sayıldığı için, doğrudan bu
      # porta ulaşan biri her istekte sahte bir IP yollayıp rate limit'i tamamen bypass edebilir.
      - "127.0.0.1:5026:5025"

  web:
    restart: unless-stopped
    build:
      context: ./client
      args:
        VITE_API_URL: ""   # boş = aynı origin; nginx /api ve /uploads'ı api'ye proxy'ler
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:     # veritabanı
  ollama:     # bge-m3 modeli (~1.2 GB, bir kez iner)
  hfcache:    # reranker modeli (~2.2 GB, bir kez iner)
  miniodata:  # MinIO object storage — yüklenen belgeler + görseller
